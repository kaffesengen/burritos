<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avansert Fysikkmotor v11.1 - Feilrettet (NaN Fix)</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121212; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; position: relative; background: #2d4c1e; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; pointer-events: none; border: 1px solid #333; z-index: 10; line-height: 1.5; }
        .hud-row { display: flex; gap: 15px; }

        #btn-fullscreen, #btn-reset { position: absolute; top: 10px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; cursor: pointer; z-index: 10; }
        #btn-fullscreen { left: 280px; }
        #btn-reset { left: 410px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; }
        #btn-fullscreen:active, #btn-reset:active { background: #333; }

        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; pointer-events: none; border: 1px solid #333; z-index: 10; width: 180px; }
        #leaderboard h3 { font-size: 13px; color: #f1c40f; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        #leaderboard ol { margin-left: 20px; color: #bdc3c7; }
        .lap-current { color: #3498db; font-weight: bold; margin-top: 5px; }
        
        #ui-panel { background: #181818; border-top: 1px solid #333; padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; font-size: 11px; z-index: 10; }
        .control { display: flex; flex-direction: column; }
        .control label { margin-bottom: 4px; color: #888; }
        .input-group { display: flex; gap: 6px; align-items: center; }
        input[type=range] { flex: 1; accent-color: #3498db; }
        input[type=number], select { width: 55px; background: #222; color: #fff; border: 1px solid #444; border-radius: 3px; font-size: 11px; text-align: center; padding: 2px; }
        select { width: 100%; padding: 4px; }
        
        #joystick-left-zone, #joystick-right-zone { position: absolute; bottom: 10px; width: 140px; height: 140px; border-radius: 50%; background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); touch-action: none; }
        #joystick-left-zone { left: 15px; }
        #joystick-right-zone { right: 15px; }
        .stick { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(52, 152, 219, 0.6); border: 2px solid #3498db; top: 45px; left: 45px; pointer-events: none; }
        
        #btn-handbrake { position: absolute; bottom: 160px; right: 25px; width: 50px; height: 50px; background: rgba(231, 76, 60, 0.3); border: 2px solid #e74c3c; border-radius: 50%; color: #e74c3c; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; z-index: 10; }
        #btn-handbrake:active { background: rgba(231, 76, 60, 0.8); color: #fff; }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-row">
            <span>Fart: <span id="hud-speed" style="color: #2ecc71;">0</span> km/t</span>
            <span>Gir: <span id="hud-gear" style="color: #3498db;">D</span></span>
            <span>RPM: <span id="hud-rpm" style="color: #e67e22;">0</span></span>
        </div>
        <div class="hud-row">
            <span>Underlag: <span id="status-surface" style="color: #bdc3c7; font-weight:bold;">ASFALT</span></span>
            <span>Spinn: <span id="hud-spin" style="color: #7f8c8d; font-weight:bold;">0%</span></span>
        </div>
    </div>

    <button id="btn-fullscreen">⛶ Fullskjerm</button>
    <button id="btn-reset">↺ Reset</button>

    <div id="leaderboard">
        <h3>Topp 5 Tider</h3>
        <ol id="lap-list">
            <li>--:--.--</li>
        </ol>
        <div class="lap-current">Nå: <span id="lap-current-time">0.00</span>s</div>
    </div>

    <div id="joystick-left-zone"><div id="stick-left" class="stick"></div></div>
    <div id="joystick-right-zone"><div id="stick-right" class="stick" style="background: rgba(46, 204, 113, 0.6); border-color: #2ecc71;"></div></div>
    <div id="btn-handbrake">HB</div>
</div>

<div id="ui-panel">
    <div class="control" style="grid-column: span 3; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 4px;">
        <label>Velg Kjøretøy:</label>
        <select id="preset-selector">
            <option value="jaguar" selected>Jaguar I-PACE EV400 (Elbil, AWD)</option>
            <option value="gokart">Proff Go-Kart (Lett, RWD)</option>
            <option value="mx5">Mazda MX-5 (Bakhjulstrekk, ICE)</option>
            <option value="r34">Nissan Skyline R34 (Firehjulstrekk, ICE)</option>
            <option value="f1">Formel 1 (Ekstrem, RWD)</option>
            <option value="custom">Egendefinert</option>
        </select>
    </div>
    <div class="control">
        <label>Motorkraft (hk):</label>
        <div class="input-group">
            <input type="range" id="p-power" min="10" max="1500" value="400">
            <input type="number" id="n-power" min="10" max="1500" value="400">
        </div>
    </div>
    <div class="control">
        <label>Vekt (kg):</label>
        <div class="input-group">
            <input type="range" id="p-mass" min="100" max="3500" value="2200">
            <input type="number" id="n-mass" min="100" max="3500" value="2200">
        </div>
    </div>
    <div class="control">
        <label>Drivhjul:</label>
        <select id="n-drivetrain">
            <option value="RWD">Bakhjul (RWD)</option>
            <option value="FWD">Forhjul (FWD)</option>
            <option value="AWD" selected>Firehjul (AWD)</option>
        </select>
    </div>
    <div class="control">
        <label>Dekkgrep:</label>
        <div class="input-group">
            <input type="range" id="p-grip" min="0.5" max="3.0" step="0.1" value="1.2">
            <input type="number" id="n-grip" min="0.5" max="3.0" step="0.1" value="1.2">
        </div>
    </div>
    <div class="control">
        <label>Svingrespons:</label>
        <div class="input-group">
            <input type="range" id="p-turn" min="1.0" max="10.0" step="0.2" value="3.5">
            <input type="number" id="n-turn" min="1.0" max="10.0" step="0.2" value="3.5">
        </div>
    </div>
    <div class="control">
        <label>Rullemotstand:</label>
        <div class="input-group">
            <input type="range" id="p-roll" min="0.01" max="0.5" step="0.01" value="0.05">
            <input type="number" id="n-roll" min="0.01" max="0.5" step="0.01" value="0.05">
        </div>
    </div>
</div>

<script>
const vehiclePresets = {
    jaguar: { power: 400, mass: 2200, drivetrain: 'AWD', grip: 1.2, turn: 3.5, roll: 0.05, w: 24, l: 52, ev: true },
    gokart: { power: 30, mass: 150, drivetrain: 'RWD', grip: 1.6, turn: 8.0, roll: 0.02, w: 16, l: 26, ev: false },
    mx5: { power: 184, mass: 1050, drivetrain: 'RWD', grip: 1.1, turn: 4.5, roll: 0.04, w: 20, l: 42, ev: false },
    r34: { power: 330, mass: 1560, drivetrain: 'AWD', grip: 1.3, turn: 3.2, roll: 0.04, w: 22, l: 48, ev: false },
    f1: { power: 1050, mass: 798, drivetrain: 'RWD', grip: 2.8, turn: 7.0, roll: 0.09, w: 26, l: 58, ev: false },
    custom: { power: 600, mass: 1200, drivetrain: 'RWD', grip: 1.0, turn: 3.0, roll: 0.05, w: 22, l: 44, ev: false }
};

let currentVehicleEV = true; 

function syncInputs(rangeId, numberId) {
    const range = document.getElementById(rangeId);
    const num = document.getElementById(numberId);
    range.addEventListener('input', () => { num.value = range.value; });
    num.addEventListener('input', () => { 
        let val = parseFloat(num.value);
        if(!isNaN(val)) range.value = val; 
    });
}
['power', 'mass', 'grip', 'turn', 'roll'].forEach(id => syncInputs('p-' + id, 'n-' + id));

const car = {
    x: 2100, y: 3200, prevX: 2100, prevY: 3200, vx: 0, vy: 0, angle: Math.PI, yawRate: 0, gear: 1, rpm: 0,
    w: vehiclePresets.jaguar.w, l: vehiclePresets.jaguar.l
};

document.getElementById('preset-selector').addEventListener('change', (e) => {
    const p = vehiclePresets[e.target.value];
    if(!p) return;
    
    document.getElementById('n-power').value = p.power; document.getElementById('n-power').dispatchEvent(new Event('input'));
    document.getElementById('n-mass').value = p.mass; document.getElementById('n-mass').dispatchEvent(new Event('input'));
    document.getElementById('n-drivetrain').value = p.drivetrain;
    document.getElementById('n-grip').value = p.grip; document.getElementById('n-grip').dispatchEvent(new Event('input'));
    document.getElementById('n-turn').value = p.turn; document.getElementById('n-turn').dispatchEvent(new Event('input'));
    document.getElementById('n-roll').value = p.roll; document.getElementById('n-roll').dispatchEvent(new Event('input'));
    
    currentVehicleEV = p.ev;
    car.w = p.w;
    car.l = p.l;
});

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

const fsBtn = document.getElementById('btn-fullscreen');
fsBtn.addEventListener('click', () => {
    const elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
});

let audioCtx, engineOsc, engineGain, squealOsc, squealGain, audioReady = false;

function initAudio() {
    if (audioReady) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        
        if (!audioCtx) {
            audioCtx = new AudioContext();
            engineOsc = audioCtx.createOscillator(); 
            engineOsc.type = 'sawtooth';
            engineGain = audioCtx.createGain(); 
            engineGain.gain.value = 0;
            engineOsc.connect(engineGain); 
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
            
            squealOsc = audioCtx.createOscillator(); 
            squealOsc.type = 'triangle';
            squealGain = audioCtx.createGain(); 
            squealGain.gain.value = 0;
            squealOsc.connect(squealGain); 
            squealGain.connect(audioCtx.destination);
            squealOsc.start();
        }

        if (audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => {
                if (audioCtx.state === 'running') audioReady = true;
            }).catch(e => {});
        } else if (audioCtx.state === 'running') {
            audioReady = true;
        }
    } catch(e) {}
}

const unlockAudio = () => { if (!audioReady) initAudio(); };
window.addEventListener('touchstart', unlockAudio);
window.addEventListener('mousedown', unlockAudio);
window.addEventListener('keydown', unlockAudio);

function playBeep(freq, duration = 0.3) {
    if (!audioReady || !audioCtx || audioCtx.state !== 'running') return;
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

const inputs = { steering: 0, throttle: 0, handbrake: false };
const skidmarks = [];

const checkpoints = [
    { x: 600, y: 2200, r: 400 },
    { x: 1800, y: 1800, r: 400 },
    { x: 4200, y: 800, r: 400 },
    { x: 4600, y: 2400, r: 400 }
];
let currentCP = 0;
let lapStartTime = performance.now();
let bestLaps = [];
let hasStarted = false;

let countdownState = -1;
let countdownTimestamp = 0;
let lastTime = performance.now();

document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('stick-left').style.transform = 'translate(0px, 0px)';
    document.getElementById('stick-right').style.transform = 'translate(0px, 0px)';
    inputs.steering = 0; 
    inputs.throttle = 0;
    inputs.handbrake = false;
    
    car.x = 2100; car.y = 3200;
    car.prevX = 2100; car.prevY = 3200;
    car.vx = 0; car.vy = 0;
    car.angle = Math.PI; 
    car.yawRate = 0; 
    car.gear = 0; 
    car.rpm = currentVehicleEV ? 0 : 1000;
    
    lastTime = performance.now(); 
    hasStarted = false; currentCP = 0;
    document.getElementById('lap-current-time').innerText = "0.00";
    
    unlockAudio();
    countdownState = 3;
    countdownTimestamp = performance.now();
    playBeep(440);
});

function setupJoystick(zoneId, stickId, onChange) {
    const zone = document.getElementById(zoneId);
    const stick = document.getElementById(stickId);
    const maxRadius = 45;
    let touchId = null;

    function handleMove(clientX, clientY) {
        const rect = zone.getBoundingClientRect();
        const deltaX = Math.max(-maxRadius, Math.min(clientX - (rect.left + rect.width / 2), maxRadius));
        const deltaY = Math.max(-maxRadius, Math.min(clientY - (rect.top + rect.height / 2), maxRadius));
        stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        onChange(deltaX / maxRadius, deltaY / maxRadius);
    }
    function reset() {
        stick.style.transform = `translate(0px, 0px)`;
        touchId = null;
        onChange(0, 0);
    }
    zone.addEventListener('touchstart', e => {
        if (touchId === null) {
            touchId = e.changedTouches[0].identifier;
            handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
    });
    window.addEventListener('touchmove', e => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === touchId) handleMove(touch.clientX, touch.clientY);
        }
    });
    window.addEventListener('touchend', e => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === touchId) reset();
        }
    });
}
setupJoystick('joystick-left-zone', 'stick-left', (x, y) => { inputs.steering = x; });
setupJoystick('joystick-right-zone', 'stick-right', (x, y) => { inputs.throttle = -y; });

const hbBtn = document.getElementById('btn-handbrake');
const handleHb = (state) => (e) => { e.preventDefault(); inputs.handbrake = state; };
hbBtn.addEventListener('touchstart', handleHb(true));
hbBtn.addEventListener('touchend', handleHb(false));
hbBtn.addEventListener('mousedown', handleHb(true));
hbBtn.addEventListener('mouseup', handleHb(false));

window.addEventListener('keydown', e => {
    if(e.key === 'w' || e.key === 'ArrowUp') inputs.throttle = 1;
    if(e.key === 's' || e.key === 'ArrowDown') inputs.throttle = -1;
    if(e.key === 'a' || e.key === 'ArrowLeft') inputs.steering = -1;
    if(e.key === 'd' || e.key === 'ArrowRight') inputs.steering = 1;
    if(e.key === ' ') inputs.handbrake = true;
});
window.addEventListener('keyup', e => {
    if(e.key === 'w' || e.key === 's' || e.key === 'ArrowUp' || e.key === 'ArrowDown') inputs.throttle = 0;
    if(e.key === 'a' || e.key === 'd' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') inputs.steering = 0;
    if(e.key === ' ') inputs.handbrake = false;
});

const trackWidth = 200;
const trackPath = new Path2D();
trackPath.moveTo(4400, 3200); trackPath.lineTo(800, 3200); trackPath.bezierCurveTo(200, 3200, 200, 2600, 600, 2200);
trackPath.lineTo(1400, 1400); trackPath.bezierCurveTo(1600, 1200, 2000, 1400, 1800, 1800);
trackPath.lineTo(1200, 2400); trackPath.bezierCurveTo(1000, 2600, 1400, 2800, 1800, 2600);
trackPath.lineTo(3200, 1600); trackPath.bezierCurveTo(3600, 1400, 3800, 800, 4200, 800);
trackPath.bezierCurveTo(4800, 800, 4800, 1600, 4400, 1800); trackPath.lineTo(4600, 2400);
trackPath.bezierCurveTo(4800, 2800, 4800, 3200, 4400, 3200);
trackPath.closePath();

const gearMaxSpeeds = [0, 45, 90, 140, 200, 280];

function update() {
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (countdownState >= 0) {
        if (now - countdownTimestamp > 1000) {
            countdownState--;
            countdownTimestamp = now;
            if (countdownState > 0) playBeep(440);
            else if (countdownState === 0) playBeep(880, 0.6);
        }
    }

    let currentLapTime = now - lapStartTime;
    if (hasStarted && countdownState < 0) {
        document.getElementById('lap-current-time').innerText = (currentLapTime / 1000).toFixed(2);
    }
    
    if (car.prevX > 2000 && car.x <= 2000 && car.y > 3000 && car.y < 3400 && countdownState < 0) {
        if (!hasStarted) {
            hasStarted = true;
            lapStartTime = now;
            currentCP = 0;
        } else if (currentCP === checkpoints.length) {
            bestLaps.push(currentLapTime);
            bestLaps.sort((a,b) => a-b);
            bestLaps = bestLaps.slice(0, 5);
            
            const listObj = document.getElementById('lap-list');
            listObj.innerHTML = '';
            bestLaps.forEach(lap => {
                let li = document.createElement('li');
                li.innerText = (lap / 1000).toFixed(2) + "s";
                listObj.appendChild(li);
            });
            lapStartTime = now;
            currentCP = 0;
        }
    }
    
    if (currentCP < checkpoints.length) {
        let cp = checkpoints[currentCP];
        if (Math.hypot(car.x - cp.x, car.y - cp.y) < cp.r) {
            currentCP++;
        }
    }

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    
    ctx.lineWidth = trackWidth;
    const onAsphalt = ctx.isPointInStroke(trackPath, car.x, car.y);
    
    ctx.lineWidth = trackWidth + 40;
    const onCurbs = ctx.isPointInStroke(trackPath, car.x, car.y) && !onAsphalt;
    
    ctx.lineWidth = trackWidth + 300;
    const onSand = ctx.isPointInStroke(trackPath, car.x, car.y) && !onAsphalt && !onCurbs;
    
    ctx.lineWidth = 1200;
    const inBounds = ctx.isPointInStroke(trackPath, car.x, car.y);

    if (!inBounds && dt > 0) {
        car.x = car.prevX;
        car.y = car.prevY;
        car.vx *= -0.4;
        car.vy *= -0.4;
    }

    const horsepower = parseFloat(params.power.value) || 30;
    const mass = parseFloat(params.mass.value) || 1000;
    const drivetrain = params.drivetrain.value;
    const baseGripMu = parseFloat(params.grip.value) || 1.0;
    
    let surfaceMu = baseGripMu;
    let rollingResistance = parseFloat(params.roll.value) || 0.05;
    let surfaceName = "ASFALT";
    let surfaceColor = "#bdc3c7";

    if (onAsphalt) {
        surfaceMu = baseGripMu;
    } else if (onCurbs) {
        surfaceMu = baseGripMu * 0.85;
        surfaceName = "CURBS";
        surfaceColor = "#e74c3c";
    } else if (onSand) {
        surfaceMu = baseGripMu * 0.4;
        rollingResistance = 0.35;
        surfaceName = "SAND";
        surfaceColor = "#f1c40f";
    } else {
        surfaceMu = baseGripMu * 0.55;
        rollingResistance = 0.15;
        surfaceName = "GRESS";
        surfaceColor = "#2ecc71";
    }

    const turnSensitivity = parseFloat(params.turn.value) || 3;

    let inNeutral = countdownState > 0;
    let rawSteer = inputs.steering;
    let deadzone = 0.15;
    let steerInput = 0;
    if (Math.abs(rawSteer) > deadzone) {
        steerInput = Math.sign(rawSteer) * ((Math.abs(rawSteer) - deadzone) / (1 - deadzone));
    }
    
    let mappedThrottle = Math.pow(Math.abs(inputs.throttle), 2.5) * Math.sign(inputs.throttle);

    const forwardX = Math.cos(car.angle);
    const forwardY = Math.sin(car.angle);
    const rightX = -Math.sin(car.angle);
    const rightY = Math.cos(car.angle);

    const forwardSpeedMS = car.vx * forwardX + car.vy * forwardY;
    const rightSpeedMS = car.vx * rightX + car.vy * rightY;
    const absSpeedKmh = Math.abs(forwardSpeedMS * 3.6);

    let targetRpm = 0;
    let torqueMultiplier = 1.0;

    if (currentVehicleEV) {
        if (inNeutral) {
            car.gear = 0; targetRpm = 0;
        } else {
            car.gear = forwardSpeedMS >= -0.5 ? 'D' : 'R';
            targetRpm = absSpeedKmh * 80;
        }
        torqueMultiplier = 1.0; 
    } else {
        if (inNeutral) {
            car.gear = 0;
            targetRpm = 1000 + (Math.max(0, mappedThrottle) * 6500); 
        } else {
            if (absSpeedKmh > 0.5 || Math.abs(mappedThrottle) > 0.01) {
                if (forwardSpeedMS >= -1) {
                    if (absSpeedKmh < 40) car.gear = 1; else if (absSpeedKmh < 80) car.gear = 2;
                    else if (absSpeedKmh < 130) car.gear = 3; else if (absSpeedKmh < 185) car.gear = 4; else car.gear = 5;
                    const prevMax = gearMaxSpeeds[car.gear - 1] || 0;
                    const curMax = gearMaxSpeeds[car.gear];
                    targetRpm = 1000 + Math.min(Math.max((absSpeedKmh - prevMax) / (curMax - prevMax), 0), 1) * 5500;
                } else {
                    car.gear = -1; targetRpm = 1000 + (absSpeedKmh / 40) * 5000;
                }
            } else {
                car.gear = 1;
                targetRpm = 1000;
            }
        }
        // Kritisk NaN Fiks: Tving car.rpm til å aldri være negativt i formelen
        torqueMultiplier = Math.max(0.3, Math.min(1.0, Math.pow(Math.max(0, car.rpm) / 5500, 1.2))); 
    }
    
    car.rpm += (targetRpm - car.rpm) * (currentVehicleEV ? 15 : 12) * dt;

    const maxAxleTraction = (mass * 9.81 / 2) * surfaceMu; 
    const enginePowerWatts = horsepower * 735.5 * 0.85; 
    
    let driveForce = 0;
    let brakeForce = 0;
    
    const isReversing = mappedThrottle < 0 && forwardSpeedMS < 1.0;
    const isBraking = mappedThrottle < 0 && forwardSpeedMS >= 1.0;

    if (inNeutral) {
        brakeForce = mass * 15.0; 
    } else {
        if (mappedThrottle > 0 || isReversing) {
            const effSpeed = Math.max(Math.abs(forwardSpeedMS), 5.0);
            const powerRatio = isReversing ? 0.3 : 1.0; 
            driveForce = (enginePowerWatts * powerRatio / effSpeed) * mappedThrottle * torqueMultiplier;
        } 
        if (isBraking) {
            brakeForce = mass * 15.0 * Math.abs(mappedThrottle);
        }
    }

    let fwdForce = 0, rwdForce = 0;
    if (drivetrain === 'FWD') fwdForce = driveForce;
    else if (drivetrain === 'RWD') rwdForce = driveForce;
    else { fwdForce = driveForce * 0.5; rwdForce = driveForce * 0.5; }

    let frontExcess = Math.max(0, Math.abs(fwdForce) - maxAxleTraction);
    let frontSpinSeverity = Math.min(1.0, frontExcess / maxAxleTraction);
    
    let rearExcess = Math.max(0, Math.abs(rwdForce) - maxAxleTraction);
    let rearSpinSeverity = (inputs.handbrake && !inNeutral) ? 1.0 : Math.min(1.0, rearExcess / maxAxleTraction);

    let brakeExcess = Math.max(0, brakeForce - (maxAxleTraction * 2));
    let brakeLockSeverity = Math.min(1.0, brakeExcess / (maxAxleTraction * 2));

    const kineticRatio = 0.65;
    let actualFwdForce = Math.abs(fwdForce) > maxAxleTraction ? Math.sign(fwdForce) * maxAxleTraction * (1.0 - ((1.0 - kineticRatio) * frontSpinSeverity)) : fwdForce;
    let actualRwdForce = Math.abs(rwdForce) > maxAxleTraction ? Math.sign(rwdForce) * maxAxleTraction * (1.0 - ((1.0 - kineticRatio) * rearSpinSeverity)) : rwdForce;

    let netLongitudinalForce = actualFwdForce + actualRwdForce;
    if (brakeForce > 0) {
        let maxBrake = (maxAxleTraction * 2) * (1.0 - (0.4 * brakeLockSeverity));
        netLongitudinalForce -= Math.min(brakeForce, maxBrake);
    }

    const airDragForce = 0.45 * forwardSpeedMS * Math.abs(forwardSpeedMS);
    const rollDragForce = rollingResistance * 0.1 * mass * 9.81 * Math.sign(forwardSpeedMS);
    netLongitudinalForce -= (airDragForce + rollDragForce);

    let accelMS2 = netLongitudinalForce / mass;
    let newForwardSpeedMS = forwardSpeedMS + accelMS2 * dt;

    let lateralGripFront = surfaceMu * (1.0 - 0.8 * Math.max(frontSpinSeverity, brakeLockSeverity)); 
    let lateralGripRear = surfaceMu * (1.0 - 0.9 * Math.max(rearSpinSeverity, brakeLockSeverity)); 
    
    const speedFactor = Math.min(Math.abs(forwardSpeedMS) / 5.0, 1.0);
    let targetYaw = steerInput * turnSensitivity * speedFactor;
    targetYaw *= (1.0 - 0.8 * Math.max(frontSpinSeverity, brakeLockSeverity)); 

    let oversteerTorque = 0;
    if (rearSpinSeverity > 0.05 && Math.abs(forwardSpeedMS) > 1.0) {
        let slideDir = rightSpeedMS > 0.5 ? 1 : (rightSpeedMS < -0.5 ? -1 : Math.sign(steerInput));
        oversteerTorque = slideDir * (rearSpinSeverity * 6.0);
    }

    let baseDamping = 8.0;
    let activeDamping = baseDamping * (1.0 - (rearSpinSeverity * 0.85));

    car.yawRate += (targetYaw - car.yawRate) * activeDamping * dt; 
    car.yawRate += oversteerTorque * dt;
    car.angle += car.yawRate * dt;

    const avgLateralGrip = (lateralGripFront + lateralGripRear) * 5.0; 
    const newRightSpeedMS = rightSpeedMS * Math.exp(-avgLateralGrip * dt);

    car.vx = forwardX * newForwardSpeedMS + rightX * newRightSpeedMS;
    car.vy = forwardY * newForwardSpeedMS + rightY * newRightSpeedMS;

    car.prevX = car.x;
    car.prevY = car.y;

    car.x += car.vx * 12 * dt;
    car.y += car.vy * 12 * dt;
    
    if (audioReady && audioCtx && audioCtx.state === 'running') {
        try {
            if (currentVehicleEV) {
                engineOsc.frequency.value = Math.max(0, 100 + (absSpeedKmh * 3));
                engineGain.gain.value = Math.max(0.01, Math.abs(mappedThrottle) * 0.1); 
            } else {
                engineOsc.frequency.value = Math.max(0, 40 + (car.rpm / 22));
                if (car.rpm < 100) engineGain.gain.value = 0;
                else engineGain.gain.value = 0.08 + (Math.abs(mappedThrottle) * 0.15); 
            }
            
            let isSlidingAudio = Math.abs(rightSpeedMS) > 4.0;
            let squealInt = Math.max(frontSpinSeverity, rearSpinSeverity, brakeLockSeverity);
            if(isSlidingAudio) squealInt = Math.max(squealInt, 0.9);
            
            if (squealInt > 0.1 && (onAsphalt || onCurbs)) {
                squealGain.gain.value = squealInt * 0.15; 
                squealOsc.frequency.value = Math.max(0, 800 + (Math.random() * 250));
            } else {
                squealGain.gain.value = 0;
            }
        } catch(e) {}
    }

    let isSliding = Math.abs(rightSpeedMS) > 4.0;
    let rearSlip = rearSpinSeverity > 0.2 || brakeLockSeverity > 0.2 || isSliding;
    let frontSlip = frontSpinSeverity > 0.2 || brakeLockSeverity > 0.2 || isSliding;
    
    let hw = car.w / 2;
    let hl = car.l / 2;

    if ((onAsphalt || onCurbs || onSand) && (rearSlip || frontSlip) && !inNeutral) {
        if (rearSlip) {
            skidmarks.push({
                x1: car.x + forwardX * (-hl + 6) + rightX * (-hw + 2), y1: car.y + forwardY * (-hl + 6) + rightY * (-hw + 2),
                x2: car.x + forwardX * (-hl + 6) + rightX * (hw - 2),  y2: car.y + forwardY * (-hl + 6) + rightY * (hw - 2)
            });
        }
        if (frontSlip) {
            skidmarks.push({
                x1: car.x + forwardX * (hl - 8) + rightX * (-hw + 2), y1: car.y + forwardY * (hl - 8) + rightY * (-hw + 2),
                x2: car.x + forwardX * (hl - 8) + rightX * (hw - 2),  y2: car.y + forwardY * (hl - 8) + rightY * (hw - 2)
            });
        }
    }
    
    // Begrenset til 5000 for å unngå krasj grunnet memory/GPU-buffer overflow på mobil
    if (skidmarks.length > 5000) skidmarks.splice(0, skidmarks.length - 5000);

    document.getElementById('hud-speed').innerText = Math.round(absSpeedKmh);
    
    let displayGear = car.gear;
    if (car.gear === -1) displayGear = 'R';
    if (car.gear === 0) displayGear = 'N';
    document.getElementById('hud-gear').innerText = displayGear;
    
    document.getElementById('hud-rpm').innerText = car.rpm < 10 ? 0 : Math.min(Math.round(car.rpm), 15000);
    
    const surfSpan = document.getElementById('status-surface');
    surfSpan.innerText = surfaceName; 
    surfSpan.style.color = surfaceColor;

    const spinSpan = document.getElementById('hud-spin');
    let displaySpin = Math.max(frontSpinSeverity, rearSpinSeverity);
    spinSpan.innerText = Math.round(displaySpin * 100) + "%";
    spinSpan.style.color = displaySpin > 0.1 ? "#e74c3c" : "#7f8c8d";

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    
    const camX = canvas.width / 2 - car.x;
    const camY = canvas.height / 2 - car.y;
    ctx.translate(camX, camY);

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    
    ctx.lineWidth = 1200; ctx.strokeStyle = '#111'; ctx.stroke(trackPath);
    ctx.lineWidth = 1160; ctx.strokeStyle = '#2d4c1e'; ctx.stroke(trackPath);
    ctx.lineWidth = trackWidth + 300; ctx.strokeStyle = '#c2b280'; ctx.stroke(trackPath);
    ctx.lineWidth = trackWidth + 40; ctx.strokeStyle = '#fff'; ctx.stroke(trackPath);
    ctx.strokeStyle = '#e74c3c'; ctx.setLineDash([30, 30]); ctx.stroke(trackPath); ctx.setLineDash([]);
    ctx.lineWidth = trackWidth; ctx.strokeStyle = '#2c2c2c'; ctx.stroke(trackPath);
    
    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(2000, 3100); ctx.lineTo(2000, 3300); ctx.stroke();

    ctx.fillStyle = 'rgba(15, 15, 15, 0.4)';
    ctx.beginPath();
    for (let i = 0; i < skidmarks.length; i++) {
        let m = skidmarks[i];
        ctx.rect(m.x1 - 2, m.y1 - 2, 4, 4);
        ctx.rect(m.x2 - 2, m.y2 - 2, 4, 4);
    }
    ctx.fill();

    if (countdownState >= 0) {
        ctx.save();
        ctx.translate(2000, 3030); 
        
        ctx.fillStyle = 'rgba(17, 17, 17, 0.9)';
        ctx.fillRect(-20, -60, 40, 120);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(-20, -60, 40, 120);
        
        ctx.fillStyle = countdownState >= 2 ? '#e74c3c' : '#331111';
        ctx.beginPath(); ctx.arc(0, -35, 12, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = countdownState === 1 ? '#f1c40f' : '#333311';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = countdownState === 0 ? '#2ecc71' : '#113311';
        ctx.beginPath(); ctx.arc(0, 35, 12, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
    }

    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    ctx.fillStyle = inputs.handbrake ? '#e74c3c' : (currentVehicleEV ? '#2ecc71' : '#3498db');
    ctx.fillRect(-hl, -hw, car.l, car.w);
    ctx.fillStyle = '#111';
    ctx.fillRect(-hl/4, -hw + 2, car.l/2, car.w - 4);
    
    ctx.fillStyle = (rearSpinSeverity > 0.1 && Math.abs(mappedThrottle) > 0 && !inNeutral) ? '#e67e22' : '#000';
    ctx.fillRect(-hl + 4, -hw - 2, 10, 4);
    ctx.fillRect(-hl + 4, hw - 2, 10, 4);
    
    ctx.fillStyle = (frontSpinSeverity > 0.1 && Math.abs(mappedThrottle) > 0 && !inNeutral) ? '#e67e22' : '#000';
    ctx.save(); ctx.translate(hl - 8, -hw - 2); ctx.rotate(steerInput * 0.5); ctx.fillRect(-5, 0, 10, 4); ctx.restore();
    ctx.save(); ctx.translate(hl - 8, hw - 2); ctx.rotate(steerInput * 0.5); ctx.fillRect(-5, -4, 10, 4); ctx.restore();

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
