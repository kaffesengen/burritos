<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avansert Fysikkmotor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>

<div id="lobby">
    <h1>Avansert Fysikkmotor</h1>
    
    <div class="lobby-box" id="mode-selection">
        <label style="color: #aaa; font-size: 12px;">Ditt Førernavn:</label>
        <input type="text" id="player-name" class="input-text" placeholder="Skriv inn navn" value="" maxlength="15" style="margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 16px;">

        <button class="btn" id="btn-sandbox-mode" style="background: #8e44ad; margin-bottom: 20px;">Spill Alene (Sandbox)</button>
        <button class="btn btn-green" id="btn-host-mode">Opprett Spill (Host)</button>
        <div style="margin: 20px 0; color: #777;">— ELLER —</div>
        <input type="text" id="join-code-input" class="input-text" placeholder="Skriv inn Host ID">
        <button class="btn" id="btn-join-mode">Bli Med</button>
    </div>

    <div class="lobby-box" id="host-ui">
        <p style="color: #2ecc71; font-weight: bold; margin-bottom: 10px;">Lobby Opprettet!</p>
        <p style="font-size: 12px; color: #aaa;">Din Host ID:</p>
        <input type="text" id="my-host-id" class="input-text" readonly style="text-align: center; font-weight: bold; font-family: monospace; margin-bottom: 10px;">
        <button class="btn" id="btn-share-link">Kopier Del-lenke</button>
        
        <div style="margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
            <label style="color: #aaa; font-size: 12px;">Antall runder:</label>
            <input type="number" id="host-laps" class="input-text" value="3" min="1" max="50" style="width: 60px; display: inline-block; margin-left: 10px; text-align: center;">
        </div>

        <p id="player-count" style="margin-top: 15px; font-size: 12px; color: #3498db;">Spillere i lobby: 1</p>
        <button class="btn btn-green" id="btn-enter-game" style="margin-top: 15px;">Gå til pit (Start Session)</button>
    </div>
    
    <div id="status-msg" style="margin-top: 20px; color: #e74c3c; font-size: 12px;"></div>
</div>

<div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-row">
            <span>Fart: <span id="hud-speed" style="color: #2ecc71;">0</span> km/t</span>
            <span>Gir: <span id="hud-gear" style="color: #3498db;">N</span></span>
            <span>RPM: <span id="hud-rpm" style="color: #e67e22;">0</span></span>
        </div>
        <div class="hud-row" style="margin-top: 5px;">
            <span>Bensin:</span>
            <div id="fuel-bar"><div id="fuel-fill"></div></div>
        </div>
        <div class="hud-row" style="margin-top: 5px; color: #f1c40f;">
            <span>Runde: <span id="hud-lap">0/0</span></span>
            <span style="margin-left: 10px;">Tid: <span id="hud-time">0.00</span></span>
        </div>
    </div>

    <button id="btn-ingame-menu">⚙️ Meny</button>

    <div id="leaderboard">
        <h3 style="margin-bottom: 5px; color: #3498db; border-bottom: 1px solid #444; padding-bottom: 3px;">TOP 5</h3>
        <ul id="lb-list" style="list-style: none; color: #ddd;"></ul>
    </div>
    
    <div id="f1-lights">
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
    </div>

    <div id="host-actions">
        <button id="btn-start-race" class="btn btn-green">🏁 Start Race</button>
        <button id="btn-reset" class="btn" style="background:#e74c3c;">↺ Reset Grid</button>
        <select id="track-selector">
            <option value="standard" selected>Bane: Standard</option>
            <option value="drift">Bane: Drift</option>
            <option value="gokart">Bane: Gokart</option>
        </select>
    </div>

    <button id="btn-fullscreen">⛶</button>
    
    <div id="joystick-left-zone"><div id="stick-left" class="stick"></div></div>
    <div id="joystick-right-zone"><div id="stick-right" class="stick" style="background: rgba(46, 204, 113, 0.6); border-color: #2ecc71;"></div></div>
    <div id="btn-handbrake">HB</div>

    <!-- In-Game Menu Overlay -->
    <div id="ingame-modal">
        <div class="modal-content">
            <h2 style="color: #fff; margin-bottom: 20px;">Spillmeny</h2>
            
            <label style="color: #aaa; font-size: 12px; display: block; text-align: left;">Bytt Kjøretøy:</label>
            <select id="ingame-preset-selector" class="input-text" style="margin-top: 5px; margin-bottom: 15px;">
                <option value="jaguar">Jaguar I-PACE EV400 (AWD)</option>
                <option value="gokart">Proff Go-Kart (RWD)</option>
                <option value="mx5">Mazda MX-5 (RWD)</option>
                <option value="r34">Nissan Skyline R34 (AWD)</option>
                <option value="s15">Nissan Silvia S15 (Driftebil)</option>
                <option value="f1">Formel 1 (RWD)</option>
            </select>

            <label style="color: #aaa; font-size: 12px; display: block; text-align: left;">Bytt Farge:</label>
            <input type="color" id="ingame-car-color" value="#3498db" style="width: 100%; height: 40px; background: #222; border: 1px solid #444; border-radius: 3px; cursor: pointer; margin-top: 5px; margin-bottom: 25px;">

            <button id="btn-resume" class="btn btn-green" style="margin-bottom: 10px;">Fortsett Spillet</button>
            <button id="btn-exit" class="btn" style="background: #e74c3c;">Avslutt til Lobby</button>
        </div>
    </div>
</div>

<div id="ui-panel">
    <div class="control">
        <label>Bytt Kjøretøy:</label>
        <select id="preset-selector">
            <option value="jaguar" selected>Jaguar I-PACE EV400 (AWD)</option>
            <option value="gokart">Proff Go-Kart (RWD)</option>
            <option value="mx5">Mazda MX-5 (RWD)</option>
            <option value="r34">Nissan Skyline R34 (AWD)</option>
            <option value="s15">Nissan Silvia S15 (Driftebil)</option>
            <option value="f1">Formel 1 (RWD)</option>
        </select>
    </div>
    <div class="control">
        <label>Farge:</label>
        <input type="color" id="car-color" value="#3498db" style="width: 100%; height: 28px; background: #222; border: 1px solid #444; border-radius: 3px; cursor: pointer;">
    </div>
    <div class="control" style="grid-column: 1 / -1;">
        <label>Styring:</label>
        <select id="input-selector">
            <option value="touch" selected>Touch / Tastatur</option>
            <option value="gamepad">Xbox Kontroller</option>
        </select>
    </div>

    <div class="control" id="sandbox-controls" style="display: none; grid-column: 1 / -1; border-top: 1px solid #444; padding-top: 10px; margin-top: 5px;">
        <label style="color: #9b59b6;">Server / Sandbox Fysikkregler (Kun Host):</label>
        <div style="display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap;">
            <div style="flex:1; min-width: 80px;">
                <span style="color:#aaa; font-size:10px;">Grep (<span id="val-grip">1.0</span>x)</span>
                <input type="range" id="sb-grip" min="0.1" max="3.0" step="0.1" value="1.0" style="width:100%">
            </div>
            <div style="flex:1; min-width: 80px;">
                <span style="color:#aaa; font-size:10px;">Motor (<span id="val-power">1.0</span>x)</span>
                <input type="range" id="sb-power" min="0.1" max="3.0" step="0.1" value="1.0" style="width:100%">
            </div>
            <div style="flex:1; min-width: 80px;">
                <span style="color:#aaa; font-size:10px;">Vekt (<span id="val-mass">1.0</span>x)</span>
                <input type="range" id="sb-mass" min="0.1" max="3.0" step="0.1" value="1.0" style="width:100%">
            </div>
            <div style="flex:1; min-width: 80px;">
                <span style="color:#aaa; font-size:10px;">Styreutslag (<span id="val-steering">1.0</span>x)</span>
                <input type="range" id="sb-steering" min="0.1" max="3.0" step="0.1" value="1.0" style="width:100%">
            </div>
            <div style="flex:1; min-width: 80px;">
                <span style="color:#aaa; font-size:10px;">Caster-Assist (<span id="val-caster">1.0</span>x)</span>
                <input type="range" id="sb-caster" min="0.0" max="3.0" step="0.1" value="1.0" style="width:100%">
            </div>
        </div>
    </div>
</div>

</body>
</html>
