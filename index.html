<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Avansert Fysikkmotor v21 - Baner, Miljø & Drift-Assist</title>
    <style>
        * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121212; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; position: relative; background: #2d4c1e; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; pointer-events: none; border: 1px solid #333; z-index: 10; line-height: 1.5; }
        .hud-row { display: flex; gap: 15px; }

        #btn-fullscreen, #btn-reset { position: absolute; top: 10px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; cursor: pointer; z-index: 10; }
        #btn-fullscreen { left: 280px; }
        #btn-reset { left: 410px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; }
        #btn-fullscreen:active, #btn-reset:active { background: #333; }

        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; pointer-events: none; border: 1px solid #333; z-index: 10; width: 180px; }
        #leaderboard h3 { font-size: 13px; color: #f1c40f; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        #leaderboard ol { margin-left: 20px; color: #bdc3c7; }
        .lap-current { color: #3498db; font-weight: bold; margin-top: 5px; }
        
        #ui-panel { background: #181818; border-top: 1px solid #333; padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; font-size: 11px; z-index: 10; }
        .control { display: flex; flex-direction: column; }
        .control label { margin-bottom: 4px; color: #888; }
        .input-group { display: flex; gap: 6px; align-items: center; }
        input[type=range] { flex: 1; accent-color: #3498db; }
        input[type=number], select { width: 55px; background: #222; color: #fff; border: 1px solid #444; border-radius: 3px; font-size: 11px; text-align: center; padding: 2px; }
        select { width: 100%; padding: 4px; }
        
        #joystick-left-zone, #joystick-right-zone { position: absolute; bottom: 10px; width: 140px; height: 140px; border-radius: 50%; background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); touch-action: none; }
        #joystick-left-zone { left: 15px; }
        #joystick-right-zone { right: 15px; }
        .stick { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(52, 152, 219, 0.6); border: 2px solid #3498db; top: 45px; left: 45px; pointer-events: none; }
        
        #btn-handbrake { position: absolute; bottom: 160px; right: 25px; width: 50px; height: 50px; background: rgba(231, 76, 60, 0.3); border: 2px solid #e74c3c; border-radius: 50%; color: #e74c3c; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; z-index: 10; }
        #btn-handbrake:active { background: rgba(231, 76, 60, 0.8); color: #fff; }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-row">
            <span>Fart: <span id="hud-speed" style="color: #2ecc71;">0</span> km/t</span>
            <span>Gir: <span id="hud-gear" style="color: #3498db;">D</span></span>
            <span>RPM: <span id="hud-rpm" style="color: #e67e22;">0</span></span>
        </div>
        <div class="hud-row">
            <span>Underlag: <span id="status-surface" style="color: #bdc3c7; font-weight:bold;">ASFALT</span></span>
            <span>Spinn: <span id="hud-spin" style="color: #7f8c8d; font-weight:bold;">0%</span></span>
        </div>
    </div>

    <button id="btn-fullscreen">⛶ Fullskjerm</button>
    <button id="btn-reset">↺ Reset</button>

    <div id="leaderboard">
        <h3>Topp 5 Tider</h3>
        <ol id="lap-list">
            <li>--:--.--</li>
        </ol>
        <div class="lap-current">Nå: <span id="lap-current-time">0.00</span>s</div>
    </div>

    <div id="joystick-left-zone"><div id="stick-left" class="stick"></div></div>
    <div id="joystick-right-zone"><div id="stick-right" class="stick" style="background: rgba(46, 204, 113, 0.6); border-color: #2ecc71;"></div></div>
    <div id="btn-handbrake">HB</div>
</div>

<div id="ui-panel">
    <div class="control" style="grid-column: span 3; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 4px;">
        <label>Velg Bane:</label>
        <select id="track-selector">
            <option value="standard" selected>Standardbane (Kombinert)</option>
            <option value="drift">Driftebane (Brede svinger & Åttetall)</option>
            <option value="gokart">Gokartbane (Trang og teknisk)</option>
        </select>
    </div>
    <div class="control" style="grid-column: span 2; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 4px;">
        <label>Velg Kjøretøy:</label>
        <select id="preset-selector">
            <option value="jaguar" selected>Jaguar I-PACE EV400 (Elbil, AWD)</option>
            <option value="gokart">Proff Go-Kart (Lett, RWD)</option>
            <option value="mx5">Mazda MX-5 (Bakhjulstrekk, ICE)</option>
            <option value="r34">Nissan Skyline R34 (Firehjulstrekk, ICE)</option>
            <option value="s15">Nissan Silvia S15 (Driftebil, RWD)</option>
            <option value="f1">Formel 1 (Ekstrem, RWD)</option>
            <option value="custom">Egendefinert</option>
        </select>
    </div>
    <div class="control" style="grid-column: span 1; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 4px;">
        <label>Styring:</label>
        <select id="input-selector">
            <option value="touch" selected>Skjerm/Tastatur</option>
            <option value="gamepad">Xbox Kontroller</option>
        </select>
    </div>
    <div class="control">
        <label>Motorkraft (hk):</label>
        <div class="input-group">
            <input type="range" id="p-power" min="10" max="1500" value="400">
            <input type="number" id="n-power" min="10" max="1500" value="400">
        </div>
    </div>
    <div class="control">
        <label>Vekt (kg):</label>
        <div class="input-group">
            <input type="range" id="p-mass" min="100" max="3500" value="2200">
            <input type="number" id="n-mass" min="100" max="3500" value="2200">
        </div>
    </div>
    <div class="control">
        <label>Drivhjul:</label>
        <select id="n-drivetrain">
            <option value="RWD">Bakhjul (RWD)</option>
            <option value="FWD">Forhjul (FWD)</option>
            <option value="AWD" selected>Firehjul (AWD)</option>
        </select>
    </div>
    <div class="control">
        <label>Dekkgrep:</label>
        <div class="input-group">
            <input type="range" id="p-grip" min="0.5" max="10.0" step="0.1" value="1.3">
            <input type="number" id="n-grip" min="0.5" max="10.0" step="0.1" value="1.3">
        </div>
    </div>
    <div class="control">
        <label>Maks Styrevinkel:</label>
        <div class="input-group">
            <input type="range" id="p-turn" min="1.0" max="10.0" step="0.2" value="3.5">
            <input type="number" id="n-turn" min="1.0" max="10.0" step="0.2" value="3.5">
        </div>
    </div>
    <div class="control">
        <label>Rullemotstand:</label>
        <div class="input-group">
            <input type="range" id="p-roll" min="0.01" max="0.5" step="0.01" value="0.05">
            <input type="number" id="n-roll" min="0.01" max="0.5" step="0.01" value="0.05">
        </div>
    </div>
</div>

<script>
const vehiclePresets = {
    jaguar: { power: 400, mass: 2200, drivetrain: 'AWD', grip: 6.0, turn: 4.0, roll: 0.05, w: 24, l: 52, ev: true, type: 'jaguar' },
    gokart: { power: 30, mass: 150, drivetrain: 'RWD', grip: 3.5, turn: 5.5, roll: 0.02, w: 16, l: 26, ev: false, type: 'gokart' },
    mx5: { power: 184, mass: 1050, drivetrain: 'RWD', grip: 3.6, turn: 4.5, roll: 0.04, w: 20, l: 42, ev: false, type: 'mx5' },
    r34: { power: 330, mass: 1560, drivetrain: 'AWD', grip: 4.1, turn: 3.8, roll: 0.04, w: 22, l: 48, ev: false, type: 'r34' },
    s15: { power: 450, mass: 1240, drivetrain: 'RWD', grip: 1.8, turn: 5.5, roll: 0.04, w: 21, l: 45, ev: false, type: 's15' }, // Økt startgrep for S15
    f1: { power: 1050, mass: 798, drivetrain: 'RWD', grip: 8.0, turn: 6.0, roll: 0.09, w: 26, l: 64, ev: false, type: 'f1' },
    custom: { power: 600, mass: 1200, drivetrain: 'RWD', grip: 1.5, turn: 4.0, roll: 0.05, w: 22, l: 44, ev: false, type: 'custom' }
};

let currentVehicleEV = true; 
let currentVehicleType = 'jaguar';

function syncInputs(rangeId, numberId) {
    const range = document.getElementById(rangeId);
    const num = document.getElementById(numberId);
    range.addEventListener('input', () => { num.value = range.value; });
    num.addEventListener('input', () => { 
        let val = parseFloat(num.value);
        if(!isNaN(val)) range.value = val; 
    });
}
['power', 'mass', 'grip', 'turn', 'roll'].forEach(id => syncInputs('p-' + id, 'n-' + id));

const car = {
    x: 0, y: 0, prevX: 0, prevY: 0, 
    vx: 0, vy: 0, angle: Math.PI, yawRate: 0, 
    gear: 1, rpm: 0, w: vehiclePresets.jaguar.w, l: vehiclePresets.jaguar.l,
    steer: 0
};

// Banedefinisjoner
const tracks = {
    standard: {
        path: (() => {
            let p = new Path2D();
            p.moveTo(4400, 3200); p.lineTo(800, 3200); p.bezierCurveTo(200, 3200, 200, 2600, 600, 2200);
            p.lineTo(1400, 1400); p.bezierCurveTo(1600, 1200, 2000, 1400, 1800, 1800);
            p.lineTo(1200, 2400); p.bezierCurveTo(1000, 2600, 1400, 2800, 1800, 2600);
            p.lineTo(3200, 1600); p.bezierCurveTo(3600, 1400, 3800, 800, 4200, 800);
            p.bezierCurveTo(4800, 800, 4800, 1600, 4400, 1800); p.lineTo(4600, 2400);
            p.bezierCurveTo(4800, 2800, 4800, 3200, 4400, 3200); p.closePath();
            return p;
        })(),
        startX: 2100, startY: 3200, startAngle: Math.PI,
        checkpoints: [{ x: 600, y: 2200, r: 400 }, { x: 1800, y: 1800, r: 400 }, { x: 4200, y: 800, r: 400 }, { x: 4600, y: 2400, r: 400 }],
        trigger: {x1: 2000, x2: 2100, y1: 3000, y2: 3400}
    },
    drift: {
        path: (() => {
            let p = new Path2D();
            p.moveTo(2500, 2000); 
            p.bezierCurveTo(1500, 3500, 500, 3000, 500, 2000); 
            p.bezierCurveTo(500, 1000, 1500, 500, 2500, 2000); 
            p.bezierCurveTo(3500, 3500, 4500, 3000, 4500, 2000); 
            p.bezierCurveTo(4500, 1000, 3500, 500, 2500, 2000); 
            p.closePath();
            return p;
        })(),
        startX: 2500, startY: 2000, startAngle: Math.PI/4,
        checkpoints: [{ x: 500, y: 2000, r: 500 }, { x: 2500, y: 2000, r: 400 }, { x: 4500, y: 2000, r: 500 }],
        trigger: {x1: 2400, x2: 2600, y1: 1800, y2: 2200}
    },
    gokart: {
        path: (() => {
            let p = new Path2D();
            p.moveTo(1000, 3000); p.bezierCurveTo(500, 3000, 500, 2000, 1000, 2000); 
            p.lineTo(3000, 2000); p.bezierCurveTo(3500, 2000, 3500, 1000, 3000, 1000); 
            p.lineTo(1000, 1000); p.bezierCurveTo(500, 1000, 500, 500, 1000, 500); 
            p.lineTo(4000, 500); p.bezierCurveTo(4500, 500, 4500, 3000, 4000, 3000); p.closePath();
            return p;
        })(),
        startX: 2000, startY: 3000, startAngle: Math.PI,
        checkpoints: [{ x: 1000, y: 2000, r: 300 }, { x: 3000, y: 1000, r: 300 }, { x: 4000, y: 500, r: 400 }],
        trigger: {x1: 1900, x2: 2100, y1: 2800, y2: 3200}
    }
};

let activeTrackId = 'standard';
let activeTrack = tracks[activeTrackId];

const envObjects = [];

function generateEnvironment() {
    envObjects.length = 0;
    // Sjekker path med tjukk strek for å sikre at ingen trær havner på veien
    ctx.lineWidth = 350; 
    for(let i=0; i<180; i++) {
        let rx = Math.random() * 5000;
        let ry = Math.random() * 4000;
        if(!ctx.isPointInStroke(activeTrack.path, rx, ry)) {
            let isHouse = Math.random() > 0.8;
            envObjects.push({
                x: rx, y: ry, 
                type: isHouse ? 'house' : 'tree', 
                color: isHouse ? (Math.random() > 0.5 ? '#8d6e63' : '#7f8c8d') : (Math.random() > 0.5 ? '#27ae60' : '#2ecc71'),
                size: isHouse ? (40 + Math.random()*30) : (15 + Math.random()*20),
                angle: Math.random() * Math.PI
            });
        }
    }
}

document.getElementById('track-selector').addEventListener('change', (e) => {
    activeTrackId = e.target.value;
    activeTrack = tracks[activeTrackId];
    document.getElementById('btn-reset').click();
    generateEnvironment();
});

document.getElementById('preset-selector').addEventListener('change', (e) => {
    const p = vehiclePresets[e.target.value];
    if(!p) return;
    document.getElementById('n-power').value = p.power; document.getElementById('n-power').dispatchEvent(new Event('input'));
    document.getElementById('n-mass').value = p.mass; document.getElementById('n-mass').dispatchEvent(new Event('input'));
    document.getElementById('n-drivetrain').value = p.drivetrain;
    document.getElementById('n-grip').value = p.grip; document.getElementById('n-grip').dispatchEvent(new Event('input'));
    document.getElementById('n-turn').value = p.turn; document.getElementById('n-turn').dispatchEvent(new Event('input'));
    document.getElementById('n-roll').value = p.roll; document.getElementById('n-roll').dispatchEvent(new Event('input'));
    currentVehicleEV = p.ev; car.w = p.w; car.l = p.l; currentVehicleType = p.type;
});

setTimeout(() => { 
    document.getElementById('preset-selector').dispatchEvent(new Event('change')); 
    document.getElementById('btn-reset').click();
    generateEnvironment();
}, 50);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

function resize() {
    canvas.width = canvas.parentElement.clientWidth || window.innerWidth;
    canvas.height = canvas.parentElement.clientHeight || window.innerHeight;
    ctx.setTransform(1, 0, 0, 1, 0, 0); 
}
window.addEventListener('resize', resize);
screen.orientation?.addEventListener('change', resize);
resize();

const fsBtn = document.getElementById('btn-fullscreen');
fsBtn.addEventListener('click', () => {
    const elem = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen(); else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    setTimeout(resize, 200);
});

let audioCtx, engineOsc, engineGain, squealOsc, squealGain, audioReady = false;

function initAudio() {
    if (audioReady) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();
        engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth';
        engineGain = audioCtx.createGain(); engineGain.gain.value = 0;
        engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
        squealOsc = audioCtx.createOscillator(); squealOsc.type = 'triangle';
        squealGain = audioCtx.createGain(); squealGain.gain.value = 0;
        squealOsc.connect(squealGain); squealGain.connect(audioCtx.destination); squealOsc.start();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audioReady = true;
    } catch(e) {}
}

const unlockAudio = () => { if (!audioReady) initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
window.addEventListener('touchstart', unlockAudio, { passive: true }); window.addEventListener('mousedown', unlockAudio); window.addEventListener('keydown', unlockAudio);

function playBeep(freq, duration = 0.3) {
    if (!audioReady || !audioCtx || audioCtx.state !== 'running') return;
    try {
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

const inputs = { steering: 0, throttle: 0, handbrake: false };
const skidmarks = [];
const activeTouchState = { left: null, right: null };
let gamepadLastY = false; 

let currentCP = 0; let lapStartTime = performance.now(); let bestLaps = []; let hasStarted = false;
let countdownState = -1; let countdownTimestamp = 0; let lastTime = performance.now();

document.getElementById('btn-reset').addEventListener('click', () => {
    activeTouchState.left = null; activeTouchState.right = null;
    document.getElementById('stick-left').style.transform = `translate(0px, 0px)`;
    document.getElementById('stick-right').style.transform = `translate(0px, 0px)`;
    inputs.steering = 0; inputs.throttle = 0; inputs.handbrake = false;
    
    car.x = activeTrack.startX; car.y = activeTrack.startY; car.prevX = activeTrack.startX; car.prevY = activeTrack.startY;
    car.vx = 0; car.vy = 0; car.angle = activeTrack.startAngle; car.yawRate = 0; 
    car.gear = 1; car.rpm = currentVehicleEV ? 0 : 1000; car.steer = 0;
    
    skidmarks.length = 0; lastTime = performance.now(); hasStarted = false; currentCP = 0;
    document.getElementById('lap-current-time').innerText = "0.00";
    
    unlockAudio(); countdownState = 3; countdownTimestamp = performance.now(); playBeep(440);
});

function setupJoystick(zoneId, stickId, touchKey, onChange) {
    const zone = document.getElementById(zoneId); const stick = document.getElementById(stickId); const maxRadius = 45;
    function handleMove(clientX, clientY) {
        if (document.getElementById('input-selector').value === 'gamepad') return;
        const rect = zone.getBoundingClientRect();
        const deltaX = Math.max(-maxRadius, Math.min(clientX - (rect.left + rect.width / 2), maxRadius));
        const deltaY = Math.max(-maxRadius, Math.min(clientY - (rect.top + rect.height / 2), maxRadius));
        stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`; onChange(deltaX / maxRadius, deltaY / maxRadius);
    }
    zone.addEventListener('touchstart', e => {
        if (document.getElementById('input-selector').value === 'gamepad') return;
        if (activeTouchState[touchKey] === null) { activeTouchState[touchKey] = e.changedTouches[0].identifier; handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }
    });
    window.addEventListener('touchmove', e => {
        if (document.getElementById('input-selector').value === 'gamepad') return;
        for (let touch of e.changedTouches) { if (touch.identifier === activeTouchState[touchKey]) handleMove(touch.clientX, touch.clientY); }
    });
    window.addEventListener('touchend', e => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === activeTouchState[touchKey]) { activeTouchState[touchKey] = null; stick.style.transform = `translate(0px, 0px)`; onChange(0, 0); }
        }
    });
}
setupJoystick('joystick-left-zone', 'stick-left', 'left', (x, y) => { inputs.steering = x; });
setupJoystick('joystick-right-zone', 'stick-right', 'right', (x, y) => { inputs.throttle = -y; });

const hbBtn = document.getElementById('btn-handbrake');
const handleHb = (state) => (e) => { if (document.getElementById('input-selector').value === 'gamepad') return; e.preventDefault(); inputs.handbrake = state; };
hbBtn.addEventListener('touchstart', handleHb(true), { passive: false }); hbBtn.addEventListener('touchend', handleHb(false), { passive: false });
hbBtn.addEventListener('mousedown', handleHb(true)); hbBtn.addEventListener('mouseup', handleHb(false));

window.addEventListener('keydown', e => {
    if (document.getElementById('input-selector').value === 'gamepad') return;
    if(e.key === 'w' || e.key === 'ArrowUp') inputs.throttle = 1; if(e.key === 's' || e.key === 'ArrowDown') inputs.throttle = -1;
    if(e.key === 'a' || e.key === 'ArrowLeft') inputs.steering = -1; if(e.key === 'd' || e.key === 'ArrowRight') inputs.steering = 1;
    if(e.key === ' ') inputs.handbrake = true;
});
window.addEventListener('keyup', e => {
    if (document.getElementById('input-selector').value === 'gamepad') return;
    if(e.key === 'w' || e.key === 's' || e.key === 'ArrowUp' || e.key === 'ArrowDown') inputs.throttle = 0;
    if(e.key === 'a' || e.key === 'd' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') inputs.steering = 0;
    if(e.key === ' ') inputs.handbrake = false;
});

const gearMaxSpeeds = [0, 45, 90, 140, 200, 280];
const tW = 160, cW = 190, sW = 240, bW = 250; 

function update() {
    try {
        const now = performance.now();
        const dt = Math.max(0.001, Math.min((now - lastTime) / 1000, 0.1));
        lastTime = now;

        let isGamepad = document.getElementById('input-selector').value === 'gamepad';
        if (isGamepad) {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) { if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; break; } }
            if (gp) {
                inputs.steering = gp.axes[0]; inputs.throttle = gp.buttons[7].value - gp.buttons[6].value; inputs.handbrake = gp.buttons[0].pressed;
                if (gp.buttons[3].pressed && !gamepadLastY) document.getElementById('btn-reset').click();
                gamepadLastY = gp.buttons[3].pressed;
            }
        }

        if (isNaN(car.x) || isNaN(car.y)) document.getElementById('btn-reset').click();

        if (countdownState >= 0) {
            if (now - countdownTimestamp > 1000) {
                countdownState--; countdownTimestamp = now;
                if (countdownState > 0) playBeep(440); else if (countdownState === 0) playBeep(880, 0.6);
            }
        }

        let currentLapTime = now - lapStartTime;

        ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.roundRect(hl - 3, -hw + 3, 4, 5, 2); ctx.roundRect(hl - 3, hw - 8, 4, 5, 2); ctx.fill();
        const appliesBrakeVisually = isBraking || (inputs.handbrake && !inNeutral);
        ctx.fillStyle = appliesBrakeVisually ? '#ff3333' : '#8b0000';
        ctx.shadowColor = appliesBrakeVisually ? '#ff0000' : 'transparent'; ctx.shadowBlur = appliesBrakeVisually ? 10 : 0;
        ctx.beginPath(); ctx.roundRect(-hl - 1, -hw + 3, 3, 5, 1); ctx.roundRect(-hl - 1, hw - 8, 3, 5, 1); ctx.fill();
        ctx.shadowBlur = 0; 

        ctx.restore(); ctx.restore();

    } catch(err) {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e74c3c'; ctx.font = '14px monospace'; ctx.fillText("CRITICAL ERROR:", 20, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff'; ctx.fillText(err.message, 20, canvas.height / 2);
    }
    requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script>
